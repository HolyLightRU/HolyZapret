name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Проверить версию и файлы для обновления
        run: |
          $cargo = (Get-Content launcher/Cargo.toml -Raw) -match '(?m)^version\s*=\s*"([^"]+)"'
          if (-not $cargo) { throw "В launcher/Cargo.toml не найдена version" }
          if (-not (Test-Path bin/HolyZapret.exe)) { throw "Нет bin/HolyZapret.exe: без этого файла-пустышки версии 3.2.0 и старше не примут архив обновления" }
          if ((Get-Item bin/HolyZapret.exe).Length -gt 4096) { throw "bin/HolyZapret.exe должен быть пустышкой, а не настоящим движком" }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      - name: Тесты
        working-directory: launcher
        env:
          HZ_TEST: "1"
        run: cargo test --workspace

      - name: Сборка лаунчера и RayOfLight
        working-directory: launcher
        run: cargo build --release --workspace

      - name: Проверить пакет
        run: |
          if (-not (Test-Path "bin/WinDivert.dll")) { throw "В репозитории нет bin/WinDivert.dll" }
          if (-not (Test-Path "launcher/target/release/holyzapret-launcher.exe")) { throw "Лаунчер не собрался" }
          if (-not (Test-Path "launcher/target/release/RayOfLight.exe")) { throw "RayOfLight не собрался" }
