name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v2.0.3"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Сверить версии
        id: ver
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v\d+(\.\d+)*$') { throw "Тег '$tag' должен выглядеть как v2.0.3" }
          $version = $tag.Substring(1)
          $manager = (Get-Content manager.bat -Raw) -match 'set "LOCAL_VERSION=([^"]+)"'
          if (-not $manager) { throw "В manager.bat не найден LOCAL_VERSION" }
          $managerVersion = $Matches[1]
          $cargo = (Get-Content launcher/Cargo.toml -Raw) -match '(?m)^version\s*=\s*"([^"]+)"'
          if (-not $cargo) { throw "В launcher/Cargo.toml не найдена version" }
          $cargoVersion = $Matches[1]
          $bad = @()
          if ($managerVersion -ne $version) { $bad += "manager.bat: $managerVersion" }
          if ($cargoVersion -ne $version) { $bad += "launcher/Cargo.toml: $cargoVersion" }
          if ($bad.Count -gt 0) { throw "Версии не совпадают с тегом $tag -> $($bad -join ', ')" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      - name: Тесты
        working-directory: launcher
        env:
          HZ_TEST: "1"
        run: cargo test

      - name: Сборка лаунчера
        working-directory: launcher
        run: cargo build --release

      - name: Упаковка
        id: pack
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $stage = Join-Path $env:RUNNER_TEMP "Holy-Zapret"
          New-Item -ItemType Directory -Force $stage | Out-Null
          git archive --format=tar HEAD -o "$env:RUNNER_TEMP/src.tar"
          tar -xf "$env:RUNNER_TEMP/src.tar" -C $stage
          foreach ($p in @("launcher", ".idea", ".github", ".gitignore", "docs", "experimental", "bin/game_filter.enabled")) {
            $full = Join-Path $stage $p
            if (Test-Path $full) { Remove-Item $full -Recurse -Force }
          }
          Copy-Item "launcher/target/release/holyzapret-launcher.exe" (Join-Path $stage "HolyZapret Launcher.exe")
          if (-not (Test-Path (Join-Path $stage "bin/HolyZapret.exe"))) { throw "В пакете нет bin/HolyZapret.exe" }
          $zip = Join-Path $env:RUNNER_TEMP "Holy-Zapret-$version.zip"
          Push-Location $stage
          7z a -tzip -mcu=on $zip * | Out-Null
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "7z завершился с кодом $LASTEXITCODE" }
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Get-Item $zip | Select-Object Name, Length

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ steps.pack.outputs.zip }}"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip --clobber
          } else {
            gh release create $env:TAG $zip --title "Version ${{ steps.ver.outputs.version }}" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh завершился с кодом $LASTEXITCODE" }
