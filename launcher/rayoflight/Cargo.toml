[package]
name = "rayoflight"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "RayOfLight"
path = "src/main.rs"

[dependencies]
aes = "0.8.4"
sha2 = "0.10.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Services", "Win32_System_ProcessStatus", "Win32_Networking_WinHttp"] }

[build-dependencies]
embed-resource = "3.0.12"
