name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v2.0.3"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Сверить версии
        id: ver
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v\d+(\.\d+)*$') { throw "Тег '$tag' должен выглядеть как v2.0.3" }
          $version = $tag.Substring(1)
          $cargo = (Get-Content launcher/Cargo.toml -Raw) -match '(?m)^version\s*=\s*"([^"]+)"'
          if (-not $cargo) { throw "В launcher/Cargo.toml не найдена version" }
          $cargoVersion = $Matches[1]
          $bad = @()
          if ($cargoVersion -ne $version) { $bad += "launcher/Cargo.toml: $cargoVersion" }
          if ($bad.Count -gt 0) { throw "Версии не совпадают с тегом $tag -> $($bad -join ', ')" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      - name: Тесты
        working-directory: launcher
        env:
          HZ_TEST: "1"
        run: cargo test --workspace

      - name: Сборка лаунчера и RayOfLight
        working-directory: launcher
        run: cargo build --release --workspace

      - name: Упаковка
        id: pack
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $stage = Join-Path $env:RUNNER_TEMP "Holy-Zapret"
          New-Item -ItemType Directory -Force $stage | Out-Null
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          git checkout-index -a -f --prefix="$stage/"
          if ($LASTEXITCODE -ne 0) { throw "git checkout-index завершился с кодом $LASTEXITCODE" }
          $lost = git -c core.quotepath=off ls-files | Where-Object { -not (Test-Path -LiteralPath (Join-Path $stage $_)) }
          if ($lost) { throw "В пакет не попали файлы: $($lost -join ', ')" }
          foreach ($p in @("launcher", ".idea", ".github", ".gitignore", "docs", "bin/game_filter.enabled")) {
            $full = Join-Path $stage $p
            if (Test-Path $full) { Remove-Item $full -Recurse -Force }
          }
          Copy-Item "launcher/target/release/holyzapret-launcher.exe" (Join-Path $stage "HolyZapret Launcher.exe")
          Copy-Item "launcher/target/release/RayOfLight.exe" (Join-Path $stage "bin/RayOfLight.exe")
          if (-not (Test-Path (Join-Path $stage "bin/WinDivert64.sys"))) { throw "В пакете нет bin/WinDivert64.sys" }
          if (-not (Test-Path (Join-Path $stage "bin/HolyZapret.exe"))) { throw "В пакете нет bin/HolyZapret.exe: версии 3.2.0 и старше не примут такой архив" }
          if (-not (Test-Path (Join-Path $stage "bin/RayOfLight.exe"))) { throw "В пакете нет bin/RayOfLight.exe" }
          $zip = Join-Path $env:RUNNER_TEMP "Holy-Zapret-$version.zip"
          Push-Location $stage
          7z a -tzip -mcu=on $zip * | Out-Null
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw "7z завершился с кодом $LASTEXITCODE" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          $broken = $archive.Entries | Where-Object { $_.FullName -match '[─-╿]' } | ForEach-Object { $_.FullName }
          $named = ($archive.Entries | Where-Object { $_.FullName -match '[Ѐ-ӿ]' }).Count
          $archive.Dispose()
          if ($broken) { throw "В архиве испорчены имена файлов: $($broken -join ', ')" }
          $expected = (git -c core.quotepath=off ls-files | Where-Object { $_ -match '[Ѐ-ӿ]' }).Count
          if ($named -ne $expected) { throw "Файлов с русскими именами в архиве $named, в репозитории $expected" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          $sha = "$zip.sha256"
          [IO.File]::WriteAllText($sha, "$hash  $(Split-Path $zip -Leaf)`n")
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Get-Item $zip, $sha | Select-Object Name, Length
          "SHA-256: $hash"

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ steps.pack.outputs.zip }}"
          $sha = "${{ steps.pack.outputs.sha }}"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip $sha --clobber
          } else {
            gh release create $env:TAG $zip $sha --title "HolyZapret ${{ steps.ver.outputs.version }}" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh завершился с кодом $LASTEXITCODE" }
